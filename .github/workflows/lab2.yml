# Button for one lab: pick a step, click Run. Engine: lab.yml (VM steps via scripts/lab.sh; client-* on a GitHub runner).
name: "Lab 2 · Gateway"
run-name: "lab2 ${{ inputs.step }}"

on:
  workflow_dispatch:
    inputs:
      step:
        type: choice
        options:
          - "edge-up"
          - "caddy-validate"
          - "caddy-reload"
          - "show-config"
          - "client-smoke"
          - "client-stream"
          - "client-structured-output"
      sync:
        description: VM steps - sync the VM checkout to this commit first (off = ~10 s faster)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/lab.yml
    with:
      lab: lab2
      step: ${{ inputs.step }}
      sync: ${{ inputs.sync }}
    secrets: inherit
