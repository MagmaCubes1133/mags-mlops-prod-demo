# Button for one lab: pick a step, click Run. Engine: lab.yml (VM steps via scripts/lab.sh; client-* on a GitHub runner).
name: "Lab 3 · Observability"
run-name: "lab3 ${{ inputs.step }}"

on:
  workflow_dispatch:
    inputs:
      step:
        type: choice
        options:
          - "metrics"
          - "metrics kv_cache"
          - "prefix-cache"
          - "client-prefix-cache"
          - "client-prefix-cache-8k"
      sync:
        description: VM steps - sync the VM checkout to this commit first (off = ~10 s faster)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/lab.yml
    with:
      lab: lab3
      step: ${{ inputs.step }}
      sync: ${{ inputs.sync }}
    secrets: inherit
